
<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" href="favicon.png" type="image/png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くるみも!漢字カード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-weight: 500;
  background: var(--app-bg);
  min-height: 100dvh;
  padding: 16px;
  transition: background 0.5s;
}
/* ===== THEMES ===== */
body.theme-pink  { --app-bg: linear-gradient(135deg, #E6B0FF 0%, #FFB6D9 25%, #FFC9E3 50%, #D4A5F5 75%, #FFE5F1 100%); }
body.theme-sky   { --app-bg: linear-gradient(135deg, #A0E9FF 0%, #BFF6FF 25%, #C9F0FF 50%, #A5D8F5 75%, #E5F6FF 100%); }
body.theme-mint  { --app-bg: linear-gradient(135deg, #B6FFD9 0%, #C9FFE3 25%, #D4F5E0 50%, #A5F5C8 75%, #E5FFF1 100%); }
body.theme-lemon { --app-bg: linear-gradient(135deg, #FFF3A0 0%, #FFE9B0 25%, #FFF0C9 50%, #FFD86B 75%, #FFF8E5 100%); }
body.theme-night { --app-bg: linear-gradient(135deg, #5B4B8A 0%, #7B68EE 25%, #9370DB 50%, #6A5ACD 75%, #B19CD9 100%); }

.container { max-width: 600px; margin: 0 auto; }

h1 {
  font-family: 'Mochiy Pop One', sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #FF69B4, #DA70D6, #FF69B4);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  font-size: 2em; margin-bottom: 16px;
  animation: bounce 2s infinite;
  filter: drop-shadow(2px 2px 0px rgba(255,182,217,0.5));
}
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

/* ===== STATUS BAR ===== */
.status-bar {
  background: white; border-radius: 20px; padding: 14px 18px;
  box-shadow: 0 6px 20px rgba(255,105,180,0.2); margin-bottom: 14px;
}
.status-top { display: flex; justify-content: space-between; align-items: center; }
.status-greeting { font-size: 1.05em; color: #DA70D6; font-weight: bold; }
.status-stats { display: flex; gap: 12px; align-items: center; }
.status-stats .stat {
  background: linear-gradient(135deg,#fff0f8,#f8e8ff);
  border: 2px solid #FFB6D9; border-radius: 12px;
  padding: 4px 10px; font-size: 1em; font-weight: bold; color: #FF69B4;
}
.level-progress {
  margin-top: 10px; height: 12px; background: #f0e0f8;
  border-radius: 8px; overflow: hidden;
}
.level-progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg,#FF69B4,#DA70D6,#9370DB);
  border-radius: 8px; transition: width 0.6s ease;
}
.level-caption { font-size: 0.75em; color: #b58fd0; text-align: right; margin-top: 4px; }

/* ===== MENU ===== */
.menu { background: white; border-radius: 25px; padding: 24px; box-shadow: 0 10px 30px rgba(255,105,180,0.3); }
.button-group { display: flex; flex-direction: column; gap: 12px; }
.mode-btn {
  color: white; border: none; padding: 18px; border-radius: 15px;
  font-size: 1.2em; font-weight: bold; cursor: pointer;
  transition: all 0.3s; box-shadow: 0 5px 15px rgba(218,112,214,0.4);
  font-family: 'Zen Maru Gothic', sans-serif;
}
.mode-btn.start-btn { font-size: 1.5em; padding: 24px; }
.mode-btn:nth-child(1) { background: linear-gradient(135deg,#FF69B4,#FF1493,#DA70D6); }
.mode-btn:nth-child(2) { background: linear-gradient(135deg,#FF85C1,#FF69B4,#DA70D6); }
.mode-btn:nth-child(3) { background: linear-gradient(135deg,#DA70D6,#BA55D3,#9370DB); }
.mode-btn:nth-child(4) { background: linear-gradient(135deg,#FFB347,#FF85C1,#FFB6D9); }
.mode-btn:nth-child(5) { background: linear-gradient(135deg,#B19CD9,#9370DB,#7B68EE); }
.mode-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 25px rgba(218,112,214,0.6); }
.mode-btn:active { transform: translateY(0); }

/* ===== WEEKLY PROGRESS BAR ===== */
.weekly-bar {
  background: white; border-radius: 20px; padding: 16px 20px;
  box-shadow: 0 6px 20px rgba(255,105,180,0.2); margin-bottom: 16px;
}
.weekly-bar h3 { color: #DA70D6; font-size: 1em; margin-bottom: 10px; text-align: center; }
.week-days { display: flex; gap: 6px; justify-content: center; }
.day-block {
  flex: 1; max-width: 52px; text-align: center;
  background: #f8f0ff; border-radius: 10px; padding: 6px 4px;
  border: 2px solid #e8d0f8; transition: all 0.3s;
}
.day-block.today { border-color: #FF69B4; background: #fff0f8; }
.day-block .day-name { font-size: 0.7em; color: #999; }
.day-block .day-score {
  font-size: 1.1em; font-weight: bold; color: #DA70D6; margin-top: 2px;
}
.day-block .day-stars { font-size: 0.9em; margin-top: 2px; min-height: 18px; }
.day-block.has-score { background: linear-gradient(135deg,#fff0f8,#f8e8ff); border-color: #FF69B4; }

/* ===== CARD ===== */
.card-container { display: none; }
.card-info {
  text-align: center; margin-bottom: 12px;
  background: linear-gradient(135deg,#FF69B4,#DA70D6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  font-size: 1.1em; font-weight: bold;
}
.accuracy { font-size: 0.85em; color: #999; margin-top: 3px; }

.card {
  background: white; border-radius: 25px; padding: 40px 30px; min-height: 260px;
  box-shadow: 0 10px 30px rgba(255,105,180,0.3);
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; cursor: pointer; margin-bottom: 16px;
  transition: transform 0.2s;
  position: relative; overflow: hidden;
}
.card:active { transform: scale(0.97); }
.card-front, .card-back { width: 100%; display: flex; justify-content: center; align-items: center; padding: 20px; }
.card-back { display: none; }
.card.flipped .card-front { display: none; }
.card.flipped .card-back { display: flex; }
.question-text { font-family: 'Klee One', cursive; font-size: 1.9em; line-height: 2; color: #333; letter-spacing: 0.1em; }
.answer-text {
  font-family: 'Klee One', cursive;
  font-size: 4em;
  background: linear-gradient(135deg,#FF69B4,#DA70D6,#9370DB);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  letter-spacing: 0.15em;
}
.tap-hint { font-size: 0.85em; color: #ccc; margin-top: 12px; }

.button-container { display: flex; gap: 14px; justify-content: center; }
.answer-btn {
  flex: 1; max-width: 240px; padding: 20px;
  font-size: 1.3em; font-weight: bold; border: none; border-radius: 15px;
  cursor: pointer; transition: all 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.15);
  font-family: 'Zen Maru Gothic', sans-serif;
}
.correct-btn { background: linear-gradient(135deg,#FFB6D9,#FF69B4,#DA70D6); color: white; }
.wrong-btn   { background: linear-gradient(135deg,#D4A5F5,#B19CD9,#9370DB); color: white; }
.answer-btn:hover  { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
.answer-btn:active { transform: translateY(0); }

/* ===== MASCOT ===== */
.mascot-bubble {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-bottom: 10px; font-size: 0.95em; color: #DA70D6;
}
.mascot-bubble .m-face { font-size: 1.6em; animation: bounce 2.5s infinite; }
.mascot-bubble .m-say {
  background: white; border: 2px solid #FFB6D9; border-radius: 14px;
  padding: 6px 12px; box-shadow: 0 3px 10px rgba(255,105,180,0.2);
}

/* ===== COIN TOAST ===== */
.coin-toast {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg,#FFD700,#FFB347);
  color: white; font-weight: bold; font-size: 1.2em;
  padding: 8px 18px; border-radius: 20px; z-index: 120;
  box-shadow: 0 5px 18px rgba(255,165,0,0.5);
  opacity: 0; pointer-events: none;
}
.coin-toast.show { animation: coinToast 1.1s ease-out; }
@keyframes coinToast {
  0%{opacity:0; transform:translate(-50%,10px) scale(0.7);}
  20%{opacity:1; transform:translate(-50%,0) scale(1.1);}
  70%{opacity:1; transform:translate(-50%,0) scale(1);}
  100%{opacity:0; transform:translate(-50%,-20px) scale(0.9);}
}

/* ===== CELEBRATIONS ===== */
.celebration {
  position: fixed; inset: 0; pointer-events: none; z-index: 100;
  display: flex; align-items: center; justify-content: center;
}
.celebration-text {
  font-family: 'Mochiy Pop One', sans-serif;
  font-size: 3em; font-weight: 400;
  background: linear-gradient(135deg,#FF69B4,#FFD700,#FF69B4);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: celebPop 0.8s ease-out forwards;
  filter: drop-shadow(0 0 20px rgba(255,105,180,0.8));
  text-align: center; padding: 20px;
}
@keyframes celebPop {
  0%  { opacity:0; transform: scale(0.3) rotate(-10deg); }
  50% { opacity:1; transform: scale(1.2) rotate(3deg); }
  80% { opacity:1; transform: scale(1) rotate(0deg); }
  100%{ opacity:0; transform: scale(0.9) translateY(-30px); }
}
.confetti-piece {
  position: fixed; width: 10px; height: 10px; border-radius: 2px;
  animation: confettiFall linear forwards;
  pointer-events: none; z-index: 99;
}
@keyframes confettiFall {
  0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* ===== RETRY banner ===== */
.retry-banner {
  background: linear-gradient(135deg,#fff3e0,#ffe0f0);
  border: 2px solid #FFB6D9; border-radius: 14px;
  padding: 12px 16px; margin-bottom: 14px;
  display: none; text-align: center;
  animation: fadeIn 0.4s;
}
.retry-banner p { color: #DA70D6; font-size: 1em; margin-bottom: 6px; }
.retry-banner span { font-size: 1.3em; color: #FF69B4; font-weight: bold; }

/* ===== RESULT ===== */
.result {
  display: none; background: white; border-radius: 25px; padding: 32px;
  box-shadow: 0 10px 30px rgba(255,105,180,0.3); text-align: center;
}
.result h2 {
  background: linear-gradient(135deg,#FF69B4,#DA70D6,#9370DB);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  font-size: 2em; margin-bottom: 20px;
}
.result-score-ring {
  width: 140px; height: 140px; margin: 0 auto 20px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 2.4em; font-weight: bold; color: #FF69B4;
  background: conic-gradient(#FF69B4 0%, #DA70D6 var(--pct), #f0e0f8 var(--pct));
  box-shadow: 0 4px 20px rgba(255,105,180,0.3);
  position: relative;
}
.result-score-ring::before {
  content: ''; position: absolute; inset: 12px;
  background: white; border-radius: 50%;
}
.result-score-ring span { position: relative; z-index: 1; }
.result-message { font-size: 1.5em; margin-bottom: 12px; }
.result-stats { font-size: 1.1em; color: #666; margin-bottom: 12px; line-height: 1.8; }
.result-reward {
  background: linear-gradient(135deg,#FFF7D6,#FFE9B0);
  border: 2px solid #FFD86B; border-radius: 14px;
  padding: 10px; margin-bottom: 16px; font-weight: bold; color: #E69500;
}
.miss-list { text-align: left; margin: 16px 0; }
.miss-item {
  background: linear-gradient(135deg,#fff0f8,#f8e8ff);
  border-left: 4px solid #FF69B4; border-radius: 10px;
  padding: 10px 14px; margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center;
}
.miss-q { color: #555; font-size: 0.95em; flex: 1; }
.miss-a { color: #FF69B4; font-size: 1.4em; font-weight: bold; margin-left: 12px; }
.retry-miss-btn {
  background: linear-gradient(135deg,#FF69B4,#DA70D6); color: white;
  border: none; border-radius: 12px; padding: 12px 20px;
  font-size: 1em; font-weight: bold; cursor: pointer; margin-bottom: 10px; width: 100%;
  font-family: 'Zen Maru Gothic', sans-serif; transition: all 0.2s;
}
.retry-miss-btn:hover { transform: translateY(-2px); }

/* ===== WEAK POINTS ===== */
.weak-points { animation: fadeIn 0.3s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.weak-point-item {
  background: linear-gradient(135deg,#FFE5F1,#FFF0F6);
  border-left: 5px solid #FF69B4; padding: 14px 16px;
  margin-bottom: 12px; border-radius: 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.weak-point-question { font-size: 1.1em; color: #333; flex: 1; }
.weak-point-answer   { font-size: 1.5em; color: #FF69B4; margin-left: 14px; min-width: 50px; text-align: center; }
.weak-point-accuracy { font-size: 1em; font-weight: bold; margin-left: 14px; min-width: 70px; text-align: right; }

/* ===== COLLECTION ===== */
.panel { display: none; animation: fadeIn 0.3s; }
.panel h2 { color:#FF69B4; text-align:center; margin-bottom:20px; }
.panel-card {
  background: white; border-radius: 20px; padding: 20px;
  box-shadow: 0 6px 20px rgba(255,105,180,0.2); margin-bottom: 16px;
}
.coll-coins {
  text-align: center; font-size: 1.3em; font-weight: bold; color: #E69500;
  margin-bottom: 14px;
}
.gacha-btn {
  width: 100%; background: linear-gradient(135deg,#FFD700,#FFB347,#FF85C1);
  color: white; border: none; border-radius: 16px; padding: 18px;
  font-size: 1.3em; font-weight: bold; cursor: pointer;
  font-family: 'Zen Maru Gothic', sans-serif; box-shadow: 0 5px 15px rgba(255,165,0,0.4);
  transition: all 0.2s;
}
.gacha-btn:hover { transform: translateY(-3px) scale(1.02); }
.gacha-btn:disabled { filter: grayscale(0.6); opacity: 0.6; cursor: not-allowed; transform: none; }
.gacha-result { min-height: 0; text-align: center; }
.gacha-result.show { min-height: 120px; margin-top: 14px; }
.gacha-pop { font-size: 4em; animation: gachaPop 0.6s ease-out; }
@keyframes gachaPop {
  0%{transform:scale(0.2) rotate(-20deg); opacity:0;}
  60%{transform:scale(1.3) rotate(8deg); opacity:1;}
  100%{transform:scale(1) rotate(0);}
}
.gacha-name { font-size: 1.2em; color: #DA70D6; font-weight: bold; }
.gacha-tag { font-size: 1em; color: #E69500; margin-top: 4px; }
.coll-progress { text-align:center; color:#DA70D6; font-weight:bold; margin: 8px 0 14px; }
.collection-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sticker-cell {
  aspect-ratio: 1; border-radius: 14px; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  border: 2px solid #f0e0f8; background: #faf5ff; transition: all 0.2s;
}
.sticker-cell.owned {
  background: linear-gradient(135deg,#fff0f8,#f8e8ff); border-color: #FFB6D9;
  box-shadow: 0 3px 10px rgba(255,105,180,0.18);
}
.sticker-cell .s-emoji { font-size: 2em; }
.sticker-cell.locked .s-emoji { filter: grayscale(1); opacity: 0.35; }
.sticker-cell .s-name { font-size: 0.6em; color: #b58fd0; margin-top: 2px; }

/* ===== SETTINGS ===== */
.settings-card label {
  display: block; color: #DA70D6; font-weight: bold;
  margin: 16px 0 8px; font-size: 1.05em;
}
.settings-card label:first-child { margin-top: 0; }
.name-input {
  width: 100%; padding: 12px 14px; border: 2px solid #FFB6D9;
  border-radius: 12px; font-size: 1.1em; font-family: 'Klee One', cursive;
  color: #555; outline: none;
}
.name-input:focus { border-color: #FF69B4; }
.theme-swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.theme-swatch {
  flex: 1; min-width: 56px; border-radius: 12px; padding: 8px 4px;
  border: 3px solid transparent; cursor: pointer; text-align: center;
  font-size: 0.75em; color: #fff; font-weight: bold;
  text-shadow: 0 1px 2px rgba(0,0,0,0.25); transition: all 0.2s;
}
.theme-swatch.active { border-color: #FF1493; transform: scale(1.05); }
.mascot-pick { display: flex; gap: 10px; flex-wrap: wrap; }
.mascot-opt {
  width: 52px; height: 52px; border-radius: 14px; font-size: 1.8em;
  display: flex; align-items: center; justify-content: center;
  border: 3px solid #f0e0f8; background: #faf5ff; cursor: pointer; transition: all 0.2s;
}
.mascot-opt.active { border-color: #FF69B4; background: #fff0f8; transform: scale(1.08); }
.sound-toggle {
  width: 100%; padding: 14px; border: none; border-radius: 14px;
  font-size: 1.15em; font-weight: bold; cursor: pointer;
  font-family: 'Zen Maru Gothic', sans-serif; color: white; transition: all 0.2s;
}
.sound-toggle.on  { background: linear-gradient(135deg,#FF69B4,#DA70D6); }
.sound-toggle.off { background: linear-gradient(135deg,#c0c0c0,#a0a0a0); }

/* ===== BUTTONS ===== */
.back-btn {
  background: linear-gradient(135deg,#FF69B4,#DA70D6,#9370DB);
  color: white; border: none; padding: 16px 36px; border-radius: 15px;
  font-size: 1.2em; font-weight: bold; cursor: pointer;
  transition: all 0.3s; box-shadow: 0 5px 15px rgba(218,112,214,0.4);
  font-family: 'Zen Maru Gothic', sans-serif; width: 100%;
}
.back-btn:hover { transform: translateY(-2px); }

.loading {
  text-align: center;
  background: linear-gradient(135deg,#FF69B4,#DA70D6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  font-size: 1.4em; margin-top: 50px;
}

/* ===== STREAK BADGE ===== */
.streak-badge {
  display: none; text-align: center; margin-bottom: 10px;
  font-size: 1.2em; color: #FF69B4; font-weight: bold;
  animation: fadeIn 0.3s;
}

@media (max-width: 480px) {
  .question-text { font-size: 1.6em; }
  .answer-text   { font-size: 3.2em; }
  .answer-btn    { font-size: 1.1em; padding: 16px; }
}
</style>
</head>
<body class="theme-pink">
<div class="container">
  <h1>🦄 <span style="font-size:0.7em">くるみも!</span>漢字カード 💖</h1>

  <!-- ステータスバー -->
  <div class="status-bar" id="statusBar">
    <div class="status-top">
      <div class="status-greeting" id="statusGreeting">こんにちは！</div>
      <div class="status-stats">
        <span class="stat">🪙 <span id="coinCount">0</span></span>
        <span class="stat">Lv.<span id="levelNum">1</span></span>
      </div>
    </div>
    <div class="level-progress"><div class="level-progress-fill" id="levelFill"></div></div>
    <div class="level-caption" id="levelCaption">つぎのレベルまで あと20もん</div>
  </div>

  <!-- 週間グラフ -->
  <div class="weekly-bar" id="weeklyBar">
    <h3>📅 今週のきろく</h3>
    <div class="week-days" id="weekDays"></div>
  </div>

  <!-- メニュー -->
  <div id="menu" class="menu">
    <div class="button-group">
      <button class="mode-btn start-btn" onclick="startMode('random')">✨ はじめる！</button>
      <button class="mode-btn" onclick="startMode('oboeru')">🔥 おぼえるぞモード (99%いか)</button>
      <button class="mode-btn" onclick="showWeakPoints()">📊 じゃくてんかくにん</button>
      <button class="mode-btn" onclick="showCollection()">🎁 コレクション</button>
      <button class="mode-btn" onclick="showSettings()">⚙️ せってい</button>
    </div>
  </div>

  <!-- カード -->
  <div id="cardContainer" class="card-container">
    <div class="card-info">
      <span id="progress">1 / 20</span>
      <div class="accuracy" id="accuracy">せいとうりつ: --%</div>
    </div>
    <div class="mascot-bubble" id="mascotBubble">
      <span class="m-face" id="mascotFace">🦄</span>
      <span class="m-say" id="mascotSay">がんばってね！</span>
    </div>
    <div class="streak-badge" id="streakBadge"></div>
    <div class="retry-banner" id="retryBanner">
      <p>💪 さっきまちがえた漢字だよ！もう一回チャレンジ！</p>
      <span id="retryWord"></span>
    </div>
    <div class="card" id="card" onclick="flipCard()">
      <div class="card-front">
        <div>
          <div class="question-text" id="question"></div>
          <div class="tap-hint">👆 タップして答えを見る</div>
        </div>
      </div>
      <div class="card-back">
        <div class="answer-text" id="answer"></div>
      </div>
    </div>
    <div class="button-container">
      <button class="answer-btn correct-btn" onclick="answerQuestion(true)">✨ かけた!</button>
      <button class="answer-btn wrong-btn"   onclick="answerQuestion(false)">💦 かけなかった</button>
    </div>
  </div>

  <!-- リザルト -->
  <div id="result" class="result">
    <h2 id="resultTitle">🎉 おつかれさま！</h2>
    <div class="result-score-ring" id="scoreRing" style="--pct:0%">
      <span id="scorePct">0%</span>
    </div>
    <div class="result-message" id="resultMessage"></div>
    <div class="result-stats" id="resultStats"></div>
    <div class="result-reward" id="resultReward" style="display:none"></div>
    <div class="miss-list" id="missList"></div>

  <!-- じゃくてん -->
  <div id="weakPoints" class="weak-points" style="display:none">
    <button class="back-btn" style="margin-bottom:16px" onclick="backToMenu()">🏠 メニューにもどる</button>
    <h2 style="color:#FF69B4;text-align:center;margin-bottom:20px">📊 じゃくてんかくにん</h2>
    <div id="weakPointsList" style="background:white;border-radius:20px;padding:20px;box-shadow:0 6px 20px rgba(255,105,180,0.2)"></div>

  <!-- コレクション -->
  <div id="collection" class="panel">
    <button class="back-btn" style="margin-bottom:16px" onclick="backToMenu()">🏠 メニューにもどる</button>
    <h2>🎁 コレクション</h2>
    <div class="panel-card">
      <div class="coll-coins">🪙 <span id="collCoins">0</span> コイン</div>
      <button class="gacha-btn" id="gachaBtn" onclick="drawGacha()">🎰 ガチャをひく！(10コイン)</button>
      <div class="gacha-result" id="gachaResult"></div>
    </div>
    <div class="panel-card">
      <div class="coll-progress" id="collProgress">あつめた数：0 / 0</div>
      <div class="collection-grid" id="collectionGrid"></div>
    </div>
  </div>

  <!-- せってい -->
  <div id="settings" class="panel">
    <button class="back-btn" style="margin-bottom:16px" onclick="backToMenu()">🏠 メニューにもどる</button>
    <h2>⚙️ せってい</h2>
    <div class="panel-card settings-card">
      <label>🌸 なまえ</label>
      <input class="name-input" id="nameInput" type="text" maxlength="8" placeholder="なまえをいれてね"
             oninput="onNameInput(this.value)">
      <label>🎨 はいけいのいろ</label>
      <div class="theme-swatches" id="themeSwatches"></div>
      <label>🦄 マスコット</label>
      <div class="mascot-pick" id="mascotPick"></div>
      <label>🔊 サウンド</label>
      <button class="sound-toggle" id="soundToggle" onclick="toggleSound()">サウンド：ON</button>
    </div>
  </div>

  <div id="loading" class="loading" style="display:none">よみこみちゅう... 💖</div>
</div>

<!-- コイン獲得トースト -->
<div class="coin-toast" id="coinToast"></div>

<!-- お祝いレイヤー -->
<div class="celebration" id="celebration" style="display:none">
  <div class="celebration-text" id="celebrationText"></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyIpsYG55zXaoBFQIMUrQpk78YZkbFIYnw5qFdEqdlzHES2iJtcYS2jxGC3rRmmBQRlkQ/exec';
const WEEK_KEY = 'kurumi_week_scores';
const PROFILE_KEY = 'kurumi_profile';
const LEVEL_STEP = 20;     // 何問正解でレベルアップするか
const GACHA_COST = 10;     // ガチャ1回のコイン
const DUP_REFUND = 3;      // ダブったときの返金コイン

// ===== ステッカー図鑑 =====
const STICKERS = [
  {e:'🦄',n:'ユニコーン'},{e:'🐰',n:'うさぎ'},{e:'🐱',n:'ねこ'},{e:'🐶',n:'いぬ'},
  {e:'🐻',n:'くま'},{e:'🐼',n:'パンダ'},{e:'🦊',n:'きつね'},{e:'🐧',n:'ペンギン'},
  {e:'🌸',n:'さくら'},{e:'🌈',n:'にじ'},{e:'⭐',n:'スター'},{e:'🍓',n:'いちご'},
  {e:'🧁',n:'カップケーキ'},{e:'🎀',n:'リボン'},{e:'👑',n:'おうかん'},{e:'💎',n:'ダイヤ'},
  {e:'🦋',n:'ちょうちょ'},{e:'🌺',n:'はな'},{e:'🍭',n:'キャンディ'},{e:'🐬',n:'イルカ'}
];

// ===== テーマ =====
const THEMES = [
  {id:'pink',  n:'ピンク',   sw:'linear-gradient(135deg,#FFB6D9,#D4A5F5)'},
  {id:'sky',   n:'みずいろ', sw:'linear-gradient(135deg,#A0E9FF,#A5D8F5)'},
  {id:'mint',  n:'みどり',   sw:'linear-gradient(135deg,#B6FFD9,#A5F5C8)'},
  {id:'lemon', n:'きいろ',   sw:'linear-gradient(135deg,#FFE9B0,#FFD86B)'},
  {id:'night', n:'よぞら',   sw:'linear-gradient(135deg,#7B68EE,#5B4B8A)'}
];

let allQuestions = [];
let currentQuestions = [];
let currentIndex = 0;
let correctCount = 0;
let isFlipped = false;
let currentMode = '';
let streak = 0;
let missedInSession = [];
let isRetryMode = false;
let coinsThisSession = 0;

// ===== プロフィール（コイン・レベル・コレクション・設定） =====
function defaultProfile() {
  return { name:'', coins:0, totalCorrect:0, owned:[], theme:'pink', sound:true, mascot:'🦄' };
}
let profile = loadProfile();
function loadProfile() {
  try { return Object.assign(defaultProfile(), JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}')); }
  catch(e) { return defaultProfile(); }
}
function saveProfile() { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); }
function getLevel() { return Math.floor(profile.totalCorrect / LEVEL_STEP) + 1; }

function addCoins(n) {
  profile.coins += n;
  saveProfile();
}
function showCoinToast(n) {
  const t = document.getElementById('coinToast');
  t.textContent = `🪙 +${n}`;
  t.classList.remove('show');
  void t.offsetWidth; // reflow でアニメ再生
  t.classList.add('show');
}

// ===== ステータスバー表示 =====
function greetingText() {
  const h = new Date().getHours();
  const g = h < 11 ? 'おはよう' : (h < 17 ? 'こんにちは' : 'こんばんは');
  return profile.name ? `${profile.mascot} ${g}、${profile.name}ちゃん！` : `${profile.mascot} ${g}！`;
}
function updateStatus() {
  document.getElementById('statusGreeting').textContent = greetingText();
  document.getElementById('coinCount').textContent = profile.coins;
  document.getElementById('levelNum').textContent = getLevel();
  const into = profile.totalCorrect % LEVEL_STEP;
  document.getElementById('levelFill').style.width = (into / LEVEL_STEP * 100) + '%';
  document.getElementById('levelCaption').textContent = `つぎのレベルまで あと${LEVEL_STEP - into}もん`;
}
function applyTheme() {
  document.body.className = 'theme-' + profile.theme;
}

// ===== サウンド（Web Audio） =====
let audioCtx = null;
function playSound(type) {
  if (!profile.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const notes = {
      correct: [660, 880],
      wrong:   [330, 247],
      coin:    [1175],
      levelup: [660, 880, 1320],
      gacha:   [523, 784, 1046]
    }[type] || [600];
    let t = audioCtx.currentTime;
    notes.forEach(f => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.start(t); o.stop(t + 0.2);
      t += 0.12;
    });
  } catch(e) {}
}

// ===== 週間記録 =====
function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function getWeekScores() {
  try { return JSON.parse(localStorage.getItem(WEEK_KEY) || '{}'); } catch(e) { return {}; }
}
function saveWeekScore(correct, total) {
  const scores = getWeekScores();
  const key = getTodayKey();
  if (!scores[key]) scores[key] = { correct: 0, total: 0 };
  scores[key].correct += correct;
  scores[key].total   += total;
  localStorage.setItem(WEEK_KEY, JSON.stringify(scores));
  renderWeeklyBar();
}
function renderWeeklyBar() {
  const scores = getWeekScores();
  const today = new Date();
  const dayNames = ['日','月','火','水','木','金','土'];
  const container = document.getElementById('weekDays');
  container.innerHTML = '';
  const todayDow = today.getDay();
  const sunday = new Date(today);
  sunday.setDate(today.getDate() - todayDow);
  for (let i = 0; i <= 6; i++) {
    const d = new Date(sunday);
    d.setDate(sunday.getDate() + i);
    const key = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    const isToday = i === todayDow;
    const s = scores[key];
    const pct = s && s.total > 0 ? Math.round(s.correct / s.total * 100) : null;
    let stars = '';
    if (pct !== null) {
      if (pct >= 90) stars = '🌟';
      else if (pct >= 70) stars = '⭐';
      else if (pct >= 50) stars = '✨';
      else stars = '💪';
    }
    const div = document.createElement('div');
    div.className = 'day-block' + (isToday ? ' today' : '') + (pct !== null ? ' has-score' : '');
    div.innerHTML = `
      <div class="day-name">${dayNames[d.getDay()]}</div>
      <div class="day-score">${pct !== null ? pct + '%' : '―'}</div>
      <div class="day-stars">${stars}</div>
    `;
    container.appendChild(div);
  }
}

// ===== データ読み込み =====
window.addEventListener('load', () => {
  applyTheme();
  updateStatus();
  renderWeeklyBar();
  loadData();
});
async function loadData() {
  document.getElementById('loading').style.display = 'block';
  try {
    const res = await fetch(SCRIPT_URL);
    allQuestions = await res.json();
    document.getElementById('loading').style.display = 'none';
  } catch(e) {
    alert('データの読み込みに失敗しました。もう一度試してください。');
    document.getElementById('loading').style.display = 'none';
  }
}

// ===== モード開始 =====
function startMode(mode, questions) {
  currentMode = mode;
  isRetryMode = false;
  streak = 0;
  missedInSession = [];
  coinsThisSession = 0;
  let qs = questions || [...allQuestions];

  if (!questions) {
    if (mode === 'oboeru') {
      qs = qs.filter(q => q.total === 0 || (q.correct / q.total) * 100 <= 99);
      qs = shuffleArray(qs);
    } else if (mode === 'random') {
      qs = shuffleArray(qs);
    }
  }

  if (qs.length === 0) {
    showCelebration('🎉 ぜんぶおぼえたよ！すごい！');
    return;
  }

  const max = mode === 'oboeru' ? qs.length : 20;
  currentQuestions = qs.slice(0, Math.min(max, qs.length));
  currentIndex = 0;
  correctCount = 0;

  hideAllScreens();
  document.getElementById('cardContainer').style.display = 'block';
  setMascotSay('がんばってね！');
  showQuestion();
}

function retryMissed() {
  if (missedInSession.length === 0) return;
  const qs = shuffleArray([...missedInSession]);
  missedInSession = [];
  isRetryMode = true;
  streak = 0;
  coinsThisSession = 0;

  document.getElementById('result').style.display = 'none';
  currentQuestions = qs;
  currentIndex = 0;
  correctCount = 0;
  document.getElementById('cardContainer').style.display = 'block';
  showQuestion();
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ===== マスコット吹き出し =====
function setMascotSay(text) {
  document.getElementById('mascotFace').textContent = profile.mascot;
  document.getElementById('mascotSay').textContent = text;
}

// ===== 問題表示 =====
function showQuestion() {
  if (currentIndex >= currentQuestions.length) { showResult(); return; }
  const q = currentQuestions[currentIndex];

  document.getElementById('question').innerText = q.question;
  document.getElementById('answer').innerText   = q.answer;
  document.getElementById('progress').innerText = `${currentIndex + 1} / ${currentQuestions.length}`;

  if (q.total > 0) {
    const acc = Math.round(q.correct / q.total * 100);
    document.getElementById('accuracy').innerText = `せいとうりつ: ${acc}%`;
  } else {
    document.getElementById('accuracy').innerText = 'せいとうりつ: --% (はじめて)';
  }

  // ストリーク表示
  const sb = document.getElementById('streakBadge');
  if (streak >= 3) {
    sb.style.display = 'block';
    sb.textContent = `🔥 ${streak}れんぞく！すごい！`;
  } else {
    sb.style.display = 'none';
  }

  // リトライバナー
  const rb = document.getElementById('retryBanner');
  if (q._isRetry) {
    rb.style.display = 'block';
    document.getElementById('retryWord').textContent = q.answer;
  } else {
    rb.style.display = 'none';
  }

  isFlipped = false;
  document.getElementById('card').classList.remove('flipped');
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('card').classList.toggle('flipped');
}

// ===== 回答 =====
function answerQuestion(isCorrect) {
  if (!isFlipped) {
    const card = document.getElementById('card');
    card.style.animation = 'none';
    card.style.transform = 'translateX(-8px)';
    setTimeout(() => { card.style.transform = 'translateX(8px)'; }, 80);
    setTimeout(() => { card.style.transform = 'translateX(0)'; }, 160);
    return;
  }

  const q = currentQuestions[currentIndex];
  const prevLevel = getLevel();

  if (isCorrect) {
    correctCount++;
    streak++;
    playSound('correct');

    // コイン獲得（連続ボーナス）
    let gain = 1;
    if (streak >= 5) gain = 3;
    else if (streak >= 3) gain = 2;
    coinsThisSession += gain;
    profile.totalCorrect++;
    addCoins(gain);
    showCoinToast(gain);

    // レベルアップ判定
    if (getLevel() > prevLevel) {
      setTimeout(() => {
        playSound('levelup');
        showCelebration(`🎉 レベルアップ！ Lv.${getLevel()}`);
        launchConfetti(35, true);
      }, 700);
      setMascotSay('レベルアップしたね！');
    }
    updateStatus();

    // お祝い演出
    if (streak >= 5) {
      showCelebration('🌟 すごすぎる！！');
      launchConfetti(30);
      setMascotSay('てんさい！');
    } else if (streak >= 3) {
      showCelebration('🔥 れんぞく！');
      launchConfetti(15);
      setMascotSay('その調子！');
    } else {
      showCelebration('✨ かけた！');
      launchConfetti(8);
      setMascotSay('できたね！');
    }
  } else {
    streak = 0;
    playSound('wrong');
    const missQ = { ...q, _isRetry: true };
    if (!missedInSession.find(m => m.row === q.row)) {
      missedInSession.push(missQ);
    }
    showNegative();
    setMascotSay('つぎいこう！');
  }

  // Google Sheets更新
  const qi = allQuestions.findIndex(item => item.row === q.row);
  if (qi !== -1) {
    if (isCorrect) allQuestions[qi].correct++;
    allQuestions[qi].total++;
  }
  updateGoogleSheet(q.row, isCorrect);

  currentIndex++;
  setTimeout(showQuestion, isCorrect ? 600 : 400);
}

function updateGoogleSheet(row, isCorrect) {
  fetch(`${SCRIPT_URL}?action=update&row=${row}&correct=${isCorrect}`)
    .catch(e => console.error('記録エラー:', e));
}

// ===== お祝い演出 =====
function showCelebration(text) {
  const cel = document.getElementById('celebration');
  const ct  = document.getElementById('celebrationText');
  ct.textContent = text;
  cel.style.display = 'flex';
  // アニメを必ず再生
  ct.style.animation = 'none';
  void ct.offsetWidth;
  ct.style.animation = '';
  setTimeout(() => { cel.style.display = 'none'; }, 1000);
}

function showNegative() {
  const msgs = ['💪 つぎがんばろ！', '😊 だいじょうぶ！', '💕 もうちょっと！', '🌈 なんどでもOK！'];
  showCelebration(msgs[Math.floor(Math.random() * msgs.length)]);
}

function launchConfetti(count, hearts) {
  const colors = ['#FF69B4','#DA70D6','#FFD700','#FF85C1','#B19CD9','#FFB6D9'];
  const shapes = ['🌟','💖','✨','🎀','🌸'];
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left   = Math.random() * 100 + 'vw';
    el.style.top    = '-20px';
    el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    el.style.animationDelay   = (Math.random() * 0.5) + 's';
    if (hearts && Math.random() < 0.5) {
      // 絵文字の紙吹雪
      el.textContent = shapes[Math.floor(Math.random() * shapes.length)];
      el.style.fontSize = (14 + Math.random() * 12) + 'px';
      el.style.background = 'transparent';
      el.style.width = 'auto'; el.style.height = 'auto';
    } else {
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.width  = (6 + Math.random() * 8) + 'px';
      el.style.height = (6 + Math.random() * 8) + 'px';
    }
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }
}

// ===== リザルト =====
function showResult() {
  document.getElementById('cardContainer').style.display = 'none';
  document.getElementById('result').style.display = 'block';

  const pct = currentQuestions.length > 0
    ? Math.round(correctCount / currentQuestions.length * 100) : 0;

  document.getElementById('scorePct').textContent = pct + '%';
  document.getElementById('scoreRing').style.setProperty('--pct', pct + '%');

  const namePrefix = profile.name ? `${profile.name}ちゃん、` : '';
  let msg = '', title = '';
  if (pct >= 90) {
    title = '🌟 かんぺき！！';
    msg = namePrefix + 'てんさいだ！！すごすぎる！！';
    launchConfetti(40, true);
  } else if (pct >= 70) {
    title = '💮 よくがんばったね！';
    msg = namePrefix + 'もうすぐかんぺき！この調子！';
    launchConfetti(20, true);
  } else if (pct >= 50) {
    title = '✨ いいかんじ！';
    msg = namePrefix + 'だんだんおぼえてきてるよ！';
  } else if (pct >= 30) {
    title = '💪 チャレンジ中！';
    msg = namePrefix + 'まだおぼえはじめ。大丈夫！くりかえせばかならずおぼえるよ！';
  } else {
    title = '🌱 スタートだよ！';
    msg = namePrefix + 'まだおぼえたばかり。0点からでもぜんぜんOK！毎日やれば絶対かわるよ💕';
  }
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMessage').textContent = msg;
  document.getElementById('resultStats').innerHTML =
    `かけた：${correctCount} / ${currentQuestions.length}もん<br>せいとうりつ：${pct}%`;

  // コイン獲得まとめ
  const reward = document.getElementById('resultReward');
  if (coinsThisSession > 0) {
    reward.style.display = 'block';
    reward.innerHTML = `🪙 コインを ${coinsThisSession}まい ゲット！（ぜんぶで ${profile.coins}まい）<br>🎁 コレクションでガチャがひけるよ！`;
  } else {
    reward.style.display = 'none';
  }

  // まちがえた漢字リスト
  const ml = document.getElementById('missList');
  if (missedInSession.length > 0) {
    let html = `<p style="color:#DA70D6;font-weight:bold;margin-bottom:8px">📝 まちがえた漢字（${missedInSession.length}こ）</p>`;
    missedInSession.forEach(p => {
      html += `<div class="miss-item">
        <span class="miss-q">${p.question}</span>
        <span class="miss-a">${p.answer}</span>
      </div>`;
    });
    ml.innerHTML = html;
    document.getElementById('retryMissBtn').style.display = 'block';
  } else {
    ml.innerHTML = '';
    document.getElementById('retryMissBtn').style.display = 'none';
  }

  if (!isRetryMode) saveWeekScore(correctCount, currentQuestions.length);
  updateStatus();
}

// ===== 画面切り替え =====
function hideAllScreens() {
  ['menu','weeklyBar','statusBar','cardContainer','result','weakPoints','collection','settings']
    .forEach(id => { document.getElementById(id).style.display = 'none'; });
}
function backToMenu() {
  hideAllScreens();
  document.getElementById('menu').style.display = 'block';
  document.getElementById('weeklyBar').style.display = 'block';
  document.getElementById('statusBar').style.display = 'block';
  updateStatus();
  renderWeeklyBar();
  loadData();
}

// ===== じゃくてん =====
function showWeakPoints() {
  const sorted = [...allQuestions].sort((a, b) => {
    if (a.total === 0 && b.total === 0) return 0;
    if (a.total === 0) return 1;
    if (b.total === 0) return -1;
    return (a.correct / a.total) - (b.correct / b.total);
  });
  const weak = sorted.filter(q => q.total === 0 || (q.correct / q.total) * 100 < 80);

  const list = document.getElementById('weakPointsList');
  if (weak.length === 0) {
    list.innerHTML = '<div style="text-align:center;font-size:1.4em;color:#FF69B4;padding:30px">すべて80%以上！すごい！🎉</div>';
  } else {
    list.innerHTML = weak.map((q, i) => {
      let accText = '未回答', accColor = '#999';
      if (q.total > 0) {
        const a = Math.round(q.correct / q.total * 100);
        accText  = a + '%';
        accColor = a >= 60 ? '#FFC107' : '#FF6B6B';
      }
      return `<div class="weak-point-item">
        <div class="weak-point-question">${i+1}. ${q.question}</div>
        <div class="weak-point-answer">${q.answer}</div>
        <div class="weak-point-accuracy" style="color:${accColor}">${accText}</div>
      </div>`;
    }).join('');
  }

  hideAllScreens();
  document.getElementById('weakPoints').style.display = 'block';
}

// ===== コレクション =====
function showCollection() {
  hideAllScreens();
  document.getElementById('collection').style.display = 'block';
  document.getElementById('gachaResult').className = 'gacha-result';
  document.getElementById('gachaResult').innerHTML = '';
  renderCollection();
}
function renderCollection() {
  document.getElementById('collCoins').textContent = profile.coins;
  document.getElementById('collProgress').textContent =
    `あつめた数：${profile.owned.length} / ${STICKERS.length}`;
  const grid = document.getElementById('collectionGrid');
  grid.innerHTML = STICKERS.map(s => {
    const owned = profile.owned.includes(s.e);
    return `<div class="sticker-cell ${owned ? 'owned' : 'locked'}">
      <div class="s-emoji">${owned ? s.e : '❓'}</div>
      <div class="s-name">${owned ? s.n : '？？？'}</div>
    </div>`;
  }).join('');
  const btn = document.getElementById('gachaBtn');
  btn.disabled = profile.coins < GACHA_COST;
}
function drawGacha() {
  if (profile.coins < GACHA_COST) {
    showCelebration('🪙 コインがたりないよ！');
    return;
  }
  profile.coins -= GACHA_COST;
  playSound('gacha');

  const pick = STICKERS[Math.floor(Math.random() * STICKERS.length)];
  const isNew = !profile.owned.includes(pick.e);
  if (isNew) profile.owned.push(pick.e);
  else profile.coins += DUP_REFUND;
  saveProfile();

  const box = document.getElementById('gachaResult');
  box.className = 'gacha-result show';
  box.innerHTML = `
    <div class="gacha-pop">${pick.e}</div>
    <div class="gacha-name">${pick.n}</div>
    <div class="gacha-tag">${isNew ? '🎉 あたらしくゲット！' : `🪙 ダブり！ +${DUP_REFUND}コイン`}</div>`;
  launchConfetti(isNew ? 22 : 6, isNew);
  if (isNew) setTimeout(() => playSound('levelup'), 250);

  renderCollection();
  updateStatus();
}

// ===== せってい =====
function showSettings() {
  hideAllScreens();
  document.getElementById('settings').style.display = 'block';
  renderSettings();
}
function renderSettings() {
  document.getElementById('nameInput').value = profile.name;

  // テーマ
  const sw = document.getElementById('themeSwatches');
  sw.innerHTML = THEMES.map(t =>
    `<div class="theme-swatch ${profile.theme === t.id ? 'active' : ''}"
          style="background:${t.sw}" onclick="setTheme('${t.id}')">${t.n}</div>`
  ).join('');

  // マスコット（デフォルト🦄 ＋ 手に入れたステッカー）
  const options = ['🦄', ...profile.owned.filter(e => e !== '🦄')];
  const mp = document.getElementById('mascotPick');
  mp.innerHTML = options.map(e =>
    `<div class="mascot-opt ${profile.mascot === e ? 'active' : ''}" onclick="setMascot('${e}')">${e}</div>`
  ).join('');

  // サウンド
  const st = document.getElementById('soundToggle');
  st.className = 'sound-toggle ' + (profile.sound ? 'on' : 'off');
  st.textContent = profile.sound ? 'サウンド：ON 🔊' : 'サウンド：OFF 🔇';
}
function onNameInput(v) {
  profile.name = v.trim();
  saveProfile();
  updateStatus();
}
function setTheme(id) {
  profile.theme = id;
  saveProfile();
  applyTheme();
  renderSettings();
}
function setMascot(e) {
  profile.mascot = e;
  saveProfile();
  updateStatus();
  renderSettings();
}
function toggleSound() {
  profile.sound = !profile.sound;
  saveProfile();
  renderSettings();
  if (profile.sound) playSound('coin');
}
</script>
</body>
</html>
